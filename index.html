<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">

    <body class="bg-dark d-flex flex-column min-vh-100">

                <h2 class="text-light m-0">Eric Enriquez</h2>

                    <div class="d-flex flex-row-reverse">
